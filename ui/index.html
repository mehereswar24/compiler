<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>ArithC - Review 1</title>
<style>
:root{--bg:#0f1624;--panel:#17213a;--line:#2a3757;--fg:#e6ecf7;--mut:#8a97b5;--acc:#3fb8b0;--err:#ff6b6b;--ok:#5fd28a}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--fg);font:14px system-ui,Segoe UI,sans-serif;height:100vh;display:flex;flex-direction:column}
header{padding:10px 18px;background:#1f3a5f;display:flex;align-items:center;gap:18px}
header h1{font-size:17px;margin:0}header small{color:#b8c6e0}.spacer{flex:1}
button{background:var(--acc);color:#04201e;border:0;border-radius:6px;padding:7px 14px;font-weight:600;cursor:pointer}
main{flex:1;display:grid;grid-template-columns:minmax(300px,38%) 1fr;min-height:0}
.left{display:flex;flex-direction:column;border-right:1px solid var(--line);min-height:0}
.right{display:flex;flex-direction:column;min-width:0;min-height:0}
.bar{padding:8px 12px;background:var(--panel);border-bottom:1px solid var(--line);color:var(--mut);display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.bar b{color:var(--fg)}.ex{background:#27406b;color:#fff;padding:3px 9px;font-size:12px;font-weight:500}
textarea{flex:1;width:100%;background:#0b111d;color:#e6ecf7;border:0;padding:12px;font:14px/1.5 Consolas,monospace;resize:none;outline:none}
#diag{max-height:30%;overflow:auto;border-top:1px solid var(--line);background:#0b111d;padding:8px 12px;font:13px Consolas,monospace;white-space:pre-wrap}
.e{color:var(--err)}.g{color:var(--ok)}
.tabs{display:flex;background:var(--panel);border-bottom:1px solid var(--line)}
.tab{padding:10px 16px;cursor:pointer;color:var(--mut);border-bottom:3px solid transparent}.tab.on{color:#fff;border-color:var(--acc)}
.pane{flex:1;overflow:auto;padding:14px 18px;min-height:0}
pre{margin:0;font:13.5px/1.45 Consolas,monospace}
table{border-collapse:collapse;width:100%}th,td{padding:5px 10px;border-bottom:1px solid var(--line);text-align:left;font:13px Consolas,monospace}
th{color:var(--mut);position:sticky;top:0;background:var(--bg)}
.chip{display:inline-block;padding:1px 8px;border-radius:10px;font-size:11.5px;background:#27406b}
.t-KEYWORD{background:#6a3fa0}.t-IDENTIFIER{background:#2c6e91}.t-INT_LITERAL,.t-FLOAT_LITERAL{background:#8a6a1f}.t-ASSIGN,.t-SEMICOLON,.t-LPAREN,.t-RPAREN{background:#3b4660}
.stmt{margin-bottom:22px}.stmt h4{margin:0 0 6px;font:600 13px Consolas,monospace;color:var(--mut)}
.stmt svg{background:#0b111d;border:1px solid var(--line);border-radius:8px;max-width:100%}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:6px;overflow:hidden;margin-left:auto}
.seg span{padding:3px 10px;cursor:pointer;color:var(--mut);font-size:12px}.seg span.on{background:var(--acc);color:#04201e;font-weight:600}
.badge{padding:2px 10px;border-radius:10px;font-weight:700;font-size:12px}.b-ok{background:#1d4d33;color:var(--ok)}.b-bad{background:#5a2020;color:var(--err)}
</style></head><body>
<header><h1>ArithC <small>Review 1: Flex lexer + Bison parser + parse tree</small></h1><div class="spacer"></div>
  <button id="go">Compile (Ctrl+Enter)</button></header>
<main>
  <section class="left">
    <div class="bar"><b>Source</b> <span>examples:</span>
      <button class="ex" data-ex="demo">demo</button><button class="ex" data-ex="prec">precedence</button><button class="ex" data-ex="syn">syntax errors</button></div>
    <textarea id="src" spellcheck="false"></textarea>
    <div id="diag"></div>
  </section>
  <section class="right">
    <div class="bar" id="status"><span>Press Compile.</span></div>
    <div class="tabs" id="tabs"></div>
    <div class="pane" id="pane"></div>
  </section>
</main>
<script>
const EX={
demo:`int a = 10;\nint b = 3;\nfloat x = 2.5;\nint c = a + b * 2 - 4 / 2;\nfloat y = x * (a - b);\nprint c;\nprint y;`,
prec:`int p = 2 ^ 3 ^ 2;      // right-associative\nint n = -4 + -(3 - 1);\nint r = 10 % 3;\nprint 2 + 3 * 4;`,
syn:`int a = 4;\nint b = (a + ;\nint c = a $ 2;\nprint a +* 2;\nint d = a * 2;\nprint d;`};
const $=s=>document.querySelector(s), esc=s=>(s||'').replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
let data=null, tab='tree', view='graph';
$('#src').value=EX.demo;
document.querySelectorAll('.ex').forEach(b=>b.onclick=()=>{$('#src').value=EX[b.dataset.ex];compile()});
$('#go').onclick=compile;
$('#src').addEventListener('keydown',e=>{if(e.ctrlKey&&e.key==='Enter')compile()});
async function compile(){
  const r=await fetch('/api/compile',{method:'POST',body:JSON.stringify({source:$('#src').value})});
  data=await r.json(); render();
}
function render(){
  const d=data;
  if(d.error){$('#pane').innerHTML=`<pre class="e">${esc(d.error)}</pre>`;return}
  const bad=/error/.test(d.diag||'');
  $('#status').innerHTML=`<span class="badge ${bad?'b-bad':'b-ok'}">${bad?'ERRORS':'OK'}</span> <span>${d.tokens.length} tokens</span>`;
  $('#diag').innerHTML=bad?esc(d.diag).split('\n').map(l=>`<div class="${/error/.test(l)?'e':''}">${l}</div>`).join(''):'<span class="g">no lexical or syntax errors</span>';
  const tabs=[['tree','Parse tree'],['tokens','Tokens'],['raw','Raw']];
  const segs=tab==='tree'?`<div class="seg"><span class="${view==='graph'?'on':''}" data-v="graph">Diagram</span><span class="${view==='text'?'on':''}" data-v="text">Text</span></div>`:'';
  $('#tabs').innerHTML=tabs.map(t=>`<div class="tab ${t[0]===tab?'on':''}" data-t="${t[0]}">${t[1]}</div>`).join('');
  document.querySelectorAll('.tab').forEach(e=>e.onclick=()=>{tab=e.dataset.t;render()});
  let h='';
  if(tab==='tokens')h=`<table><tr><th>Line</th><th>Token</th><th>Lexeme</th></tr>${d.tokens.map(t=>`<tr><td>${t.line}</td><td><span class="chip t-${t.type}">${t.type}</span></td><td>${esc(t.lexeme)}</td></tr>`).join('')}</table>`;
  else if(tab==='tree')h=view==='graph'?treeSvgs(d.tree):`<pre>${esc(d.tree)}</pre>`;
  else h=`<pre>${esc(d.raw)}</pre>`;
  $('#pane').innerHTML=h;
  const st=$('#status'); if(segs){st.insertAdjacentHTML('beforeend',segs);st.querySelectorAll('.seg span').forEach(e=>e.onclick=()=>{view=e.dataset.v;render()})}
}

/* ---- parse tree -> SVG ---- */
function parseTree(text){
  const roots=[],stack=[];
  text.split('\n').slice(1).forEach(line=>{
    const m=line.match(/^((?:\|   |    )*)(\|-- |`-- )(.*)$/); if(!m)return;
    const n={label:m[3],kids:[],depth:m[1].length/4};
    while(stack.length&&stack[stack.length-1].depth>=n.depth)stack.pop();
    stack.length?stack[stack.length-1].kids.push(n):roots.push(n);
    stack.push(n);
  });
  return roots;
}
function colour(l){const w=l.split(' ')[0];
  return ['Decl','Assign','Print'].includes(w)?'#6a3fa0':['BinOp','Neg'].includes(w)?'#1b8a8a':['Int','Float'].includes(w)?'#8a6a1f':w==='Var'?'#2c6e91':'#555b66'}
function srcOf(n){ // rebuild the source expression from the tree for the caption
  const w=n.label.split(' ');
  if(w[0]==='Int'||w[0]==='Float')return w[1];
  if(w[0]==='Var')return w[1];
  if(w[0]==='Neg')return '-'+srcOf(n.kids[0]);
  if(w[0]==='BinOp')return '('+srcOf(n.kids[0])+' '+w[1].replace(/'/g,'')+' '+srcOf(n.kids[1])+')';
  if(w[0]==='Print')return 'print '+srcOf(n.kids[0]);
  if(w[0]==='Decl')return w[1]+' '+w[2]+(n.kids[0]?' = '+srcOf(n.kids[0]):'');
  if(w[0]==='Assign')return w[1]+' = '+srcOf(n.kids[0]);
  return n.label}
function treeSvgs(text){
  const roots=parseTree(text);
  if(!roots.length)return '<div class="e">no tree (parse failed before any statement completed)</div>';
  return roots.map(r=>{
    let leaf=0; const W=Math.max(90,0);
    (function lay(n,d){n.d=d;if(!n.kids.length)n.x=leaf++;else{n.kids.forEach(k=>lay(k,d+1));n.x=(n.kids[0].x+n.kids[n.kids.length-1].x)/2}})(r,0);
    let md=0;(function f(n){md=Math.max(md,n.d);n.kids.forEach(f)})(r);
    const cw=Math.max(...[...JSON.stringify(r).matchAll(/"label":"([^"]*)"/g)].map(m=>m[1].length))*8.2+26, ch=64, pad=16, bh=32;
    const w=leaf*cw+pad*2, h=(md+1)*ch+pad*2-14;
    const pos=n=>[pad+(n.x+.5)*cw, pad+n.d*ch+bh/2];
    let lines='',boxes='';
    (function walk(n){const [x,y]=pos(n);
      n.kids.forEach(k=>{const [kx,ky]=pos(k);lines+=`<path d="M${x},${y+bh/2} C${x},${y+bh/2+18} ${kx},${ky-bh/2-18} ${kx},${ky-bh/2}" stroke="#5b6a8c" stroke-width="1.6" fill="none"/>`;walk(k)});
      const bw=n.label.length*8.2+18;
      boxes+=`<g><rect x="${x-bw/2}" y="${y-bh/2}" width="${bw}" height="${bh}" rx="8" fill="${colour(n.label)}"/><text x="${x}" y="${y+5}" text-anchor="middle" fill="#fff" font-family="Consolas,monospace" font-size="13.5" font-weight="700">${esc(n.label)}</text></g>`})(r);
    return `<div class="stmt"><h4>${esc(srcOf(r))}</h4><svg width="${w}" height="${h}" viewBox="0 0 ${w} ${h}">${lines}${boxes}</svg></div>`}).join('');
}
compile();
</script></body></html>
